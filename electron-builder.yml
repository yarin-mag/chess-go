appId: com.bchess.app
productName: B-Chess
directories:
  output: dist
files:
  - out/**
  - package.json
protocols:
  name: B-Chess Auth Callback
  schemes:
    - b-chess
win:
  target: nsis
  # Unsigned build: skip the code-sign toolchain download (which needs symlink privileges on Windows).
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.board-games
  target: dmg
  # Unsigned build (no paid Apple Developer account needed).
  identity: null
